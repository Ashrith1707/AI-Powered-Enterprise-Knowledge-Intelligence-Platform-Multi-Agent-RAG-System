server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: every non-file path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy to FastAPI (service name from docker-compose)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 60m;   # allow 50 MB uploads + overhead
        proxy_read_timeout 180s;    # LLM answers can take a while
    }
}
