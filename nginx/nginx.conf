# Standalone Nginx reverse proxy (alternative to the frontend container's
# built-in config — use this when fronting the whole stack from a host Nginx
# with TLS termination).
#
#   upstream backend  → FastAPI  (127.0.0.1:8001)
#   root              → frontend production build (frontend/dist)

upstream knowledgeiq_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name knowledgeiq.example.com;   # ← your domain

    # In production terminate TLS here (or at a load balancer) and redirect:
    # return 301 https://$host$request_uri;

    client_max_body_size 30m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://knowledgeiq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;          # required for SSE streaming
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        root /var/www/knowledgeiq/dist;   # ← frontend build output
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /var/www/knowledgeiq/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
