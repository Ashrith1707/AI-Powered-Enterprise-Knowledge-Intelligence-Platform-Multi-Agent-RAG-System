name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (offline providers — no API keys needed)
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: local
          SECRET_KEY: ci-test-secret-key-32-bytes-long!!
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build

  deprecated-model-guard:
    name: No deprecated Gemini models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if text-embedding-004 or legacy SDK appears in source
        run: |
          if grep -rn --include='*.py' --include='*.js' --include='*.jsx' --include='*.json' --include='*.yml' \
               -e 'text-embedding-004' -e 'google.generativeai' \
               backend/app frontend/src docker-compose.yml .github 2>/dev/null | grep -v 'deprecated'; then
            echo "Deprecated Gemini model/SDK usage found!"
            exit 1
          fi
          echo "OK: no deprecated text-embedding-004 / google.generativeai usage."
