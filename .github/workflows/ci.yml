name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (offline providers — no API keys needed)
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: local
          SECRET_KEY: ci-test-secret-key-32-bytes-long!!
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build

  deprecated-model-guard:
    name: No deprecated Gemini models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The legacy SDK must not be a declared dependency
        run: |
          if grep -iE 'google-generativeai' backend/requirements.txt; then
            echo "Legacy google-generativeai SDK found in requirements!" && exit 1
          fi
          echo "OK: requirements.txt uses only the modern google-genai SDK."
      - name: No deprecated model/SDK usage in real code (AST-based, comments exempt)
        run: |
          python3 - <<'EOF'
          import ast, pathlib, re, sys
          bad = []
          for p in pathlib.Path('backend/app').rglob('*.py'):
              tree = ast.parse(p.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      mods = [a.name for a in node.names] if isinstance(node, ast.Import) else [node.module or '']
                      if any('generativeai' in (m or '') for m in mods):
                          bad.append(f"{p}:{node.lineno} imports legacy SDK")
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      v = node.value
                      if ('text-embedding-004' in v or 'google.generativeai' in v) \
                         and 'deprecated' not in v.lower() and 'legacy' not in v.lower():
                          bad.append(f"{p}:{node.lineno} string literal: {v[:60]!r}")
          for p in list(pathlib.Path('frontend/src').rglob('*.js')) + list(pathlib.Path('frontend/src').rglob('*.jsx')):
              for m in re.finditer(r"""['"`]([^'"`]*(?:text-embedding-004|google\.generativeai)[^'"`]*)['"`]""", p.read_text()):
                  if 'deprecated' not in m.group(1).lower():
                      bad.append(f"{p} string literal: {m.group(1)[:60]!r}")
          if bad:
              print("DEPRECATED GEMINI USAGE FOUND:")
              print("\n".join(f"  {b}" for b in bad))
              sys.exit(1)
          print("OK: no deprecated text-embedding-004 / google.generativeai usage in code.")
          EOF
